<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wendougee LITA · 전체 UI 검토</title>
<style>
@font-face{font-family:Pretendard;src:url('/font.otf')}*{box-sizing:border-box}body{margin:0;background:#0a101a;color:#e2ebf9;font:14px Pretendard,system-ui}button,input{font:inherit}button{cursor:pointer;border:0;color:inherit;background:#ffffff08;border-radius:10px;padding:10px 14px}button:hover{background:#ffffff15}button[aria-pressed=true]{background:#d6e5fb;color:#111e31}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #86b5ff;outline-offset:3px}header{height:76px;display:flex;gap:16px;align-items:center;padding:0 24px;border-bottom:1px solid #ffffff0d}header strong{font-size:20px}header span{color:#8597b1;font-size:12px}header .controls{margin-left:auto;display:flex;gap:8px;align-items:center}.toggle{display:flex;gap:3px;background:#ffffff05;border-radius:12px;padding:3px}.app{display:grid;grid-template-columns:230px 1fr;height:calc(100vh - 76px)}aside{padding:18px 12px;overflow:auto;border-right:1px solid #ffffff0d}input{width:100%;padding:12px;border:1px solid #ffffff13;border-radius:10px;background:#ffffff05;color:inherit;margin-bottom:15px}.category{font-size:11px;letter-spacing:.04em;color:#8093b0;padding:16px 12px 8px}aside button{display:block;text-align:left;width:100%;background:none;padding:11px 12px;line-height:1.3}aside button[aria-current=true]{background:#ffffff10;color:#fff}aside small{float:right;color:#8093b0}main{min-width:0;overflow:auto;padding:24px}.heading{display:flex;align-items:center;gap:12px;margin-bottom:18px}.heading h1{margin:0;font-size:19px;font-weight:500}.heading span{color:#8093b0;margin-left:auto;font-size:12px}.viewer{display:grid;gap:20px}.viewer.compare{grid-template-columns:1fr 1fr}.viewer.grid{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}figure{margin:0;min-width:0}img{width:100%;display:block;border-radius:12px;background:#111c2c;aspect-ratio:2388/1668;object-fit:contain}figure a{display:block;border-radius:12px;box-shadow:0 12px 40px #0002}figcaption{display:flex;gap:8px;color:#8b9db5;font-size:12px;padding:10px 2px}.caption-title{color:#d9e4f4}.note{line-height:1.7;color:#7287a4;font-size:12px;margin:24px 0 0}.error{padding:60px;color:#97abc5}.keyboard{opacity:.65}#count{margin-top:16px;color:#7287a4;font-size:11px;padding:8px 12px}@media(min-width:1300px){.viewer:not(.compare):not(.grid) figure{max-width:1250px;margin:auto}}@media(max-width:800px){header{height:auto;min-height:76px;flex-wrap:wrap;padding:16px;gap:10px}header span{display:none}.app{grid-template-columns:170px 1fr;height:calc(100vh - 110px)}main{padding:14px}.viewer.compare{grid-template-columns:1fr}header .controls{margin-left:0}.heading{flex-wrap:wrap}.heading span{display:none}}@media(max-width:520px){.app{grid-template-columns:1fr;height:auto}aside{max-height:220px;border-bottom:1px solid #ffffff0d}.viewer.grid{grid-template-columns:1fr}}
</style>
<header><strong>Wendougee LITA</strong><span>전체 UI · 실제 앱 캡처</span><div class="controls"><div class="toggle" aria-label="시간"><button data-theme="day" aria-pressed="true">낮</button><button data-theme="night" aria-pressed="false">밤</button></div><button id="compare" aria-pressed="false">낮·밤 비교</button><button id="homecompare" aria-pressed="false">홈과 비교</button><button id="grid" aria-pressed="false">전체 보기</button></div></header>
<div class="app"><aside><input id="search" aria-label="화면 검색" placeholder="화면 검색"><nav id="screens" aria-label="앱 화면"></nav><div id="count"></div></aside><main><div class="heading"><button id="previous" aria-label="이전 화면">←</button><button id="next" aria-label="다음 화면">→</button><h1 id="title">화면을 불러오는 중</h1><span class="keyboard">← → 화면 이동 · 이미지를 누르면 원본</span></div><div id="viewer" class="viewer"></div><p class="note">실제 앱의 공통 Compose 화면을 1194 × 834pt, 2×로 렌더링했습니다. 데모 데이터이며 이 갤러리에서는 머신 조작을 전송하지 않습니다. 팝업은 동일한 앱 콘텐츠를 캡처용 호스트에 표시합니다. UIKit 네이티브 Liquid Glass 캡처가 아닙니다.</p></main></div>
<script>
let screens=[],selected=0,theme='day',mode='single',generation='';
const $=id=>document.getElementById(id), params=new URLSearchParams(location.search);
function filtered(){const q=$('search').value.toLowerCase();return screens.filter(s=>(s.title+s.category+s.id).toLowerCase().includes(q))}
function nav(){const root=$('screens');root.replaceChildren();let category='';for(const screen of filtered()){
 if(category!==screen.category){category=screen.category;const h=document.createElement('div');h.className='category';h.textContent=category;root.append(h)}
 const b=document.createElement('button');b.textContent=screen.title;b.setAttribute('aria-current',screens[selected]===screen);b.onclick=()=>{selected=screens.indexOf(screen);if(mode!=='home')mode='single';show()};root.append(b)
} $('count').textContent=screens.length+'개 화면·상태 / '+screens.length*2+'장';}
function figure(screen,t){const f=document.createElement('figure'),a=document.createElement('a'),i=document.createElement('img'),c=document.createElement('figcaption');
 a.href='/'+screen.id+'-'+t+'.png';a.target='_blank';a.rel='noopener';i.src=a.href+'?v='+encodeURIComponent(generation);i.alt=screen.title+' · '+(t==='day'?'낮':'밤');i.loading='lazy';a.append(i);c.textContent=i.alt;f.append(a,c);return f;
}
function show(){nav();const screen=screens[selected];if(!screen)return;$('title').textContent=mode==='grid'?'전체 화면':screen.title;const v=$('viewer');v.className='viewer '+(mode==='single'?'':mode==='home'?'compare':mode);v.replaceChildren();
 if(mode==='grid')filtered().forEach(s=>v.append(figure(s,theme)));else if(mode==='home'){v.append(figure(screens.find(s=>s.id==='dashboard'),theme),figure(screen,theme))}else if(mode==='compare'){v.append(figure(screen,'day'),figure(screen,'night'))}else v.append(figure(screen,theme));
 document.querySelectorAll('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.theme===theme));$('compare').setAttribute('aria-pressed',mode==='compare');$('homecompare').setAttribute('aria-pressed',mode==='home');$('grid').setAttribute('aria-pressed',mode==='grid');
 history.replaceState(null,'','?screen='+screen.id+'&theme='+theme+'&mode='+mode);
}
function step(delta){selected=(selected+delta+screens.length)%screens.length;mode='single';show()}
$('homecompare').onclick=()=>{mode=mode==='home'?'single':'home';show()};
$('previous').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('search').oninput=()=>mode==='grid'?show():nav();$('compare').onclick=()=>{mode=mode==='compare'?'single':'compare';show()};$('grid').onclick=()=>{mode=mode==='grid'?'single':'grid';show()};document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{theme=b.dataset.theme;show()});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});
fetch('/manifest.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{screens=data.screens;generation=data.generatedAt||'';selected=Math.max(0,screens.findIndex(s=>s.id===params.get('screen')));theme=params.get('theme')==='night'?'night':'day';mode=['grid','compare','home'].includes(params.get('mode'))?params.get('mode'):'single';show()}).catch(()=>{$('title').textContent='화면을 렌더링하고 있습니다';$('viewer').innerHTML='<p class="error">캡처가 완료되면 새로고침해 주세요.</p>'});
setInterval(async()=>{if(document.hidden)return;try{const d=await (await fetch('/manifest.json',{cache:'no-store'})).json();if(d.generatedAt&&generation!==d.generatedAt){generation=d.generatedAt;screens=d.screens;show()}}catch{}},5000);
</script>
</html>
