name: Apple build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  landscape-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out sources
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install isolated browser test dependency
        run: npm install --prefix .build/preview-tools --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: .build/preview-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Check landscape preview and interactions
        env:
          CREMA_PLAYWRIGHT_MODULE: ${{ github.workspace }}/.build/preview-tools/node_modules/playwright
        run: node outputs/check-ui-preview.cjs
      - name: Save design review screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ipad-landscape-preview
          path: .build/preview-review/
          retention-days: 7

  apple-build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out sources
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Show Apple toolchain and shared schemes
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -list -project Crema.xcodeproj

      - name: Test CremaKit
        run: swift test

      - name: Build iOS simulator app
        if: ${{ !cancelled() }}
        run: |
          xcodebuild build \
            -project Crema.xcodeproj \
            -scheme Crema-iOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/ios-app \
            CODE_SIGNING_ALLOWED=NO

      - name: Build macOS app
        if: ${{ !cancelled() }}
        run: |
          xcodebuild build \
            -project Crema.xcodeproj \
            -scheme Crema-macOS \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath .build/macos-app \
            CODE_SIGNING_ALLOWED=NO
