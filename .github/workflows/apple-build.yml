name: Apple build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apple-build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out sources
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Show Apple toolchain and shared schemes
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -list -project Crema.xcodeproj

      - name: Test CremaKit
        run: swift test

      - name: Build iOS simulator app
        if: ${{ !cancelled() }}
        run: |
          xcodebuild build \
            -project Crema.xcodeproj \
            -scheme Crema-iOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/ios-app \
            CODE_SIGNING_ALLOWED=NO

      - name: Build macOS app
        if: ${{ !cancelled() }}
        run: |
          xcodebuild build \
            -project Crema.xcodeproj \
            -scheme Crema-macOS \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath .build/macos-app \
            CODE_SIGNING_ALLOWED=NO
