name: Wendougee LITA iPad UI

on:
  push:
    branches: [master, 'codex/geeflow-ipad-ui']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'scripts/preview-compose.cjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geeflow-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-review:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: zulu
      - uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: true
      - name: Check Korean resources
        run: ./scripts/check-korean.ps1
      - name: Render actual shared Compose screens
        run: .\gradlew.bat :shared:feature:device:dashboard:generateStoreScreenshots :shared:app:generateAllScreens --no-configuration-cache
      - name: Test appearance and dashboard behavior
        run: .\gradlew.bat :shared:core:ui:jvmTest :shared:feature:intro:jvmTest :shared:app:jvmTest :shared:feature:device:dashboard:jvmTest :shared:domain:user:jvmTest :shared:domain:device:jvmTest --no-configuration-cache
      - name: Compile complete desktop app
        run: .\gradlew.bat :desktopApp:compileKotlin --no-configuration-cache
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: geeflow-compose-review
          path: |
            docs/screenshots/*.png
            docs/review/all-ui/*.png
            docs/review/all-ui/manifest.json
            shared/**/build/reports/tests/
          retention-days: 7
  ios-build:
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: zulu
      - uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: true
      - name: Build iPad simulator app and UI tests
        working-directory: iosApp
        run: xcodebuild -project iosApp.xcodeproj -scheme NativeReview -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ../build/ios-review build-for-testing CODE_SIGNING_ALLOWED=NO
      - name: Capture native Liquid Glass on iPad
        run: bash scripts/capture-native-ipad.sh
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: geeflow-native-ipad-review
          path: build/native-review/
          retention-days: 7
